version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: railway_delay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: railway_delay_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railway_delay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: railway_delay_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/railway_delay_db
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=indian-railways-ai-secret-key-2026-production-token
      - CORS_ORIGINS=["*"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/app/ml/artifacts:/app/backend/app/ml/artifacts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: railway_delay_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
